services:
  manager:
    build: .
    image: traefik-cloudflare-manager:local
    restart: unless-stopped
    ports:
      - "${TCM_HTTP_PORT:-8080}:${TCM_CONTAINER_PORT:-8080}"
    environment:
      TCM_LISTEN_ADDR: ":${TCM_CONTAINER_PORT:-8080}"
      TCM_MANAGER_SERVICE_URL: "http://traefik-cloudflare-manager:${TCM_CONTAINER_PORT:-8080}"
    volumes:
      - manager-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  manager-data:
